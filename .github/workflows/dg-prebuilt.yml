name: "dg-prebuilt (staging: build-linux-cuda, build-windows-cuda, resolve)"

# Build and publish our stable-diffusion.cpp (sd-cli + sd-server) prebuilts for
# CPU, Apple, CUDA, and Vulkan. MiniMax-H3 uses the native engine on GPU hosts too.
# Vulkan must carry the same H3 and graph-segment fixes as the other backends,
# rather than sending AMD hosts to an older upstream fallback binary.
#
# Shape mirrors unslothai/llama.cpp's prebuilt pipeline, simplified for a 7-way
# CPU/Apple/Vulkan matrix plus best-effort CUDA legs:
#   resolve      -- take THIS repository at the requested ref, merge the pinned PR set
#                   in scripts/unsloth/pr-set.json, stamp a source tarball, name it
#                   after the upstream release the tree descends from (supply-chain
#                   aged), decide if our release already exists.
#   build-unix   -- macOS arm64 (Metal) + x64, Linux x64 + arm64, Linux Vulkan.
#   build-windows-- Windows x64 CPU + Vulkan (MSVC + Ninja).
#   build-linux-cuda / build-windows-cuda -- x64, CUDA 12.8 and 13.3, best effort
#                   (continue-on-error); the CUDA runtime is not bundled, see build-linux-cuda.
#   assemble     -- fingerprint gate, sha256 + manifest, coverage gate, atomic
#                   draft->publish. If any CPU/Apple/Vulkan leg fails, assemble
#                   is skipped and nothing is published (the Studio needs the full
#                   asset set). The CUDA legs are exempt: each ships when it built and is
#                   absent when it did not, so it can never hold back the fallbacks.
#
# Asset names match the Studio installer's resolve_release_asset.
#
# We build THIS repository's tree, not a tarball fetched from anywhere else. Our own fixes are
# commits here, so there is nothing to re-apply at build time and nothing to keep in step with a
# foreign tag. The published tag still names the upstream release the tree descends from, so a box
# can say what it is built on without the build depending on that repository.
#
# On top of that tree, scripts/unsloth/pr-set.json can pin pull requests in THIS repository to
# exact reviewed commits, merged in listed order at build time. That is the same mechanism as
# unslothai/llama.cpp, with one deliberate difference: there the base is a pristine upstream
# release and every Unsloth change stays pinned, whereas here the base is our own tree, so a
# merged fix is simply in it and its pin is deleted. To carry a fix that exists as an upstream
# pull request, vendor it here as a PR first and pin that; the build never fetches from another
# repository.

on:
  push:
    branches: ['dg-*']

permissions:
  contents: read

concurrency:
  group: sd-prebuilt-${{ github.ref_name }}
  cancel-in-progress: false

env:
  UNSLOTH_SD_MIN_RELEASE_AGE_HOURS: "6"

jobs:
  resolve:
    name: Resolve tag + stamp source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      upstream_tag: ${{ steps.r.outputs.upstream_tag }}
      ahead: ${{ steps.r.outputs.ahead }}
      pins: ${{ steps.r.outputs.pins }}
      commit: ${{ steps.r.outputs.commit }}
      exists: ${{ steps.r.outputs.exists }}
      source_artifact: ${{ steps.r.outputs.source_artifact }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout this repository with full history, which the tag name is derived from
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - id: r
        run: |
          set -euo pipefail
          AGE_H='${{ github.event.inputs.min_age_hours }}'
          [ -n "$AGE_H" ] || AGE_H="${UNSLOTH_SD_MIN_RELEASE_AGE_HOURS:-6}"

          # The tree we build is this checkout. The tag still has to say which upstream release
          # it descends from, so read that from the history rather than from a foreign API.
          #
          # HIGHEST reachable release, not nearest. `git describe` answers "nearest", and on a
          # merge-shaped history that is the wrong answer: this tree reaches master-813 through a
          # merge 73 commits back and master-811 on its own line 13 commits back, so describe
          # names it after 811 and understates what it actually contains. The strict regex also
          # keeps out our own published tags, which live in this repository and carry a -u suffix.
          UPSTREAM_TAG="$(git tag -l --merged HEAD 'master-*' \
            | grep -E '^master-[0-9]+-[0-9a-f]+$' | sort -t- -k2,2n | tail -1)"
          [ -n "$UPSTREAM_TAG" ] || {
            echo "no upstream release tag is reachable from this ref; cannot name the build" >&2
            exit 1
          }

          # Supply-chain aging, kept but re-pointed: it now guards the upstream release the tree
          # descends from, not the moment we merged it. A tree whose base is hours old is the
          # thing worth waiting on; our own commits on top are reviewed here.
          BASE_TS="$(git log -1 --format=%ct "refs/tags/${UPSTREAM_TAG}")"
          CUTOFF="$(date -u -d "-${AGE_H} hours" +%s)"
          [ "$BASE_TS" -le "$CUTOFF" ] || {
            echo "base release ${UPSTREAM_TAG} is younger than ${AGE_H}h; refusing" >&2
            exit 1
          }

          # Resolve the PR mix set (scripts/unsloth/pr-set.json). Same mechanism as
          # unslothai/llama.cpp: an exact, reviewed commit per entry, so an author pushing more
          # commits cannot change what the nightly ships. Only PRs in THIS repository may be
          # pinned; to carry an upstream fix, vendor it here as a PR first and pin that.
          #
          # The gate lives here rather than only in a lint, because a red lint does not stop the
          # schedule.
          jq -e '.prs | type == "array" and all(.[];
                   type == "string"
                   or (type == "object" and (.url | type == "string")
                       and ((if .required == null then true else .required end) | type == "boolean")))' \
             scripts/unsloth/pr-set.json >/dev/null \
            || { echo "scripts/unsloth/pr-set.json: .prs must be an array of PR url strings, or {url, required} objects" >&2; exit 1; }
          PRS='[]'
          URL_RE='^https://github\.com/unslothai/stable-diffusion\.cpp/pull/([0-9]+)/commits/([0-9a-f]{40})/?$'
          while read -r url REQUIRED; do
            [[ "$url" =~ $URL_RE ]] || { echo "refusing malformed PR url '$url' (expected https://github.com/unslothai/stable-diffusion.cpp/pull/<n>/commits/<40-hex-sha>)" >&2; exit 1; }
            NUM="${BASH_REMATCH[1]}"; SHA="${BASH_REMATCH[2]}"
            PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUM}")" \
              || { echo "refusing #${NUM}: could not fetch PR metadata (nonexistent number in '$url', or a transient API failure); fix the pin or retry" >&2; exit 1; }
            STATE="$(jq -r '.state' <<<"$PR_JSON")"
            HEAD_PR="$(jq -r '.head.sha' <<<"$PR_JSON")"
            N_COMMITS="$(jq -r '.commits' <<<"$PR_JSON")"
            TITLE="$(jq -r '.title' <<<"$PR_JSON")"
            if [ "$STATE" != "open" ]; then
              # Dropping a pin changes SETHASH and the tag, so the release would ship without that
              # change under a new name. Refuse unless the entry is explicitly optional.
              if [ "$REQUIRED" != "false" ]; then
                echo "refusing #${NUM}: pin is ${STATE} and required. If it merged, delete the pin (its commits are already in this tree). Otherwise mark it \"required\": false or repin it." >&2
                exit 1
              fi
              echo "::warning::skipping optional pin #${NUM} (${STATE}): $url"
              continue
            fi
            # A pin pasted from the wrong PR would build arbitrary code while the manifest blames
            # #<num>. The commits listing is capped at 250; past that, skip rather than false-fail.
            if [ "$N_COMMITS" -gt 250 ]; then
              echo "note: #${NUM} has ${N_COMMITS} commits (over the API listing cap); skipping pin membership check"
            elif ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUM}/commits" --paginate --jq '.[].sha' | grep -qx "$SHA"; then
              echo "refusing #${NUM}: pinned commit ${SHA} is not a commit of that PR (wrong paste, or force-pushed away)" >&2
              exit 1
            fi
            [ "$SHA" = "$HEAD_PR" ] || echo "note: #${NUM} is pinned to ${SHA} but its head has moved to ${HEAD_PR}"
            echo "including #${NUM} @ ${SHA}"
            PRS="$(jq -c --arg n "$NUM" --arg s "$SHA" --arg u "$url" --arg t "$TITLE" '. + [{number: ($n|tonumber), sha: $s, url: $u, title: $t}]' <<<"$PRS")"
          done < <(jq -r '.prs[] | if type == "string" then {url: ., required: true} else . end
                          | "\(.url)\t\(if .required == null then true else .required end)"' scripts/unsloth/pr-set.json | tr '\t' ' ')

          # Merge the pinned commits onto this tree, in listed order (merge order matters for
          # conflicts). diff3 so additive_merge.py can see the merge base and refuse to guess on
          # anything that is not a provable add/add.
          for row in $(jq -r '.[] | "\(.number):\(.sha)"' <<<"$PRS"); do
            NUM="${row%%:*}"; SHA="${row##*:}"
            git fetch -q --no-tags origin "$SHA" \
              || git fetch -q --no-tags origin "refs/pull/${NUM}/head" \
              || { echo "could not fetch commit ${SHA} for #${NUM}" >&2; exit 1; }
            git -c user.name='Unsloth CI' -c user.email='ci@unsloth.ai' \
                -c merge.conflictStyle=diff3 merge --no-edit "$SHA" && continue
            python3 scripts/unsloth/additive_merge.py \
              || { echo "merging #${NUM} conflicts in a way that needs a human; fix the pin" >&2; exit 1; }
            git -c user.name='Unsloth CI' -c user.email='ci@unsloth.ai' commit --no-edit -q
            echo "merged #${NUM} with additive conflict resolution"
          done

          # Always -u<id>: the tree is ours, never a stock upstream one, and the suffix is what
          # tells Studio's installer to go straight to this repository's releases instead of
          # trying an upstream download that is guaranteed to 404. With no pins the id is the head
          # sha; with pins it also hashes the pinned number:sha pairs, so a repin or a reorder
          # yields a new tag and a rebuild while an unchanged set still matches and skips.
          HEAD_SHA7="$(git rev-parse --short=7 HEAD)"
          if [ "$(jq length <<<"$PRS")" = 0 ]; then
            TAG_ID="$HEAD_SHA7"
          else
            TAG_ID="$(jq -r 'map("\(.number):\(.sha)") | join("\n")' <<<"$PRS" \
              | { cat; echo "$HEAD_SHA7"; } | sha256sum | cut -c1-7)"
          fi
          TAG="${UPSTREAM_TAG}-u${TAG_ID}"
          AHEAD="$(git rev-list --count "refs/tags/${UPSTREAM_TAG}..HEAD")"
          PIN_LIST="$(jq -r 'map("#\(.number)") | join(",")' <<<"$PRS")"
          echo "building this repository at ${HEAD_SHA7} (${AHEAD} commits past ${UPSTREAM_TAG}), pins [${PIN_LIST}] -> ${TAG}"

          # Does OUR published release already exist? (drafts don't count.) Checked against the
          # final tag, so a new commit or a repin republishes instead of matching.
          EXISTS=false
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" = "false" ]; then
            EXISTS=true
          fi
          # ggml is a REQUIRED submodule; the server frontend + libwebp/libwebm are not
          # (we build with SD_SERVER_BUILD_FRONTEND / SD_WEBP / SD_WEBM off), so fetch only
          # ggml to keep the source tarball small and the build self-contained.
          git submodule update --init --recursive --depth 1 ggml
          # The CUDA build includes cmake/cutlass.cmake, which fails without the CUTLASS headers
          # (INT8 GEMM and CuTe attention kernels). Only include/ is compiled against, so keep that
          # and the license and drop the rest of the checkout from the source tarball.
          git submodule update --init --depth 1 thirdparty/cutlass
          find thirdparty/cutlass -mindepth 1 -maxdepth 1 ! -name include ! -name LICENSE.txt ! -name .git -exec rm -rf {} +
          # ggml changes we carry on top of the pinned submodule commit (the submodule points at
          # leejet/ggml, which we do not push to). A patch that no longer applies fails the build.
          for p in scripts/unsloth/ggml-patches/*.patch; do
            [ -e "$p" ] || continue
            git -C ggml apply --verbose "../$p"
          done
          COMMIT="$(git rev-parse HEAD)"
          SRC_ARTIFACT="sd-source-${TAG}"
          if [ "$EXISTS" != "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tar --exclude-vcs --exclude=.github -czf "${RUNNER_TEMP}/sd-source-${TAG}.tar.gz" .
            echo "stamped source for ${TAG} (${COMMIT})"
          else
            echo "release ${TAG} already published; skipping source prep"
          fi

          {
            echo "tag=$TAG"
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "ahead=$AHEAD"
            echo "pins=$PIN_LIST"
            echo "commit=$COMMIT"
            echo "exists=$EXISTS"
            echo "source_artifact=$SRC_ARTIFACT"
          } >> "$GITHUB_OUTPUT"

      - name: Upload source artifact
        if: ${{ steps.r.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.r.outputs.source_artifact }}
          path: ${{ runner.temp }}/sd-source-${{ steps.r.outputs.tag }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-linux-cuda:
    name: Linux-Ubuntu-22.04-x86_64-${{ matrix.line }}
    needs: resolve
    continue-on-error: true
    if: ${{ needs.resolve.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: cuda12
            cuda: "12.8.0"
            archs: "70;75;80;86;89;90;100;120"
          # CUDA 13 dropped Volta.
          - line: cuda13
            cuda: "13.3"
            archs: "75;80;86;89;90;100;120"
    # The ccache key tracks both, since both change the objects.
    env:
      CUDA_VERSION: ${{ matrix.cuda }}
      CUDA_ARCHS: ${{ matrix.archs }}
    steps:
      - name: Checkout mirror (tooling)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: tooling
          fetch-depth: 1

      - name: Free disk for the toolkit
        run: |
          set -eux
          # The hosted image ships ~25 GB free; the toolkit plus a seven-architecture ggml-cuda
          # build does not fit beside the preinstalled Android and .NET trees.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Download source @ ${{ needs.resolve.outputs.tag }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: ${{ needs.resolve.outputs.source_artifact }}
          path: srcpkg
      - name: Extract source
        run: |
          set -eux
          mkdir -p src
          tar -xzf "srcpkg/sd-source-${{ needs.resolve.outputs.tag }}.tar.gz" -C src

      # Component tables copied from unslothai/llama.cpp's unsloth-cuda-linux-setup, so both projects
      # link the sonames Studio already resolves for llama-server. nvrtc: cudnn-frontend's headers
      # include nvrtc.h (it dlopens libnvrtc itself, so nothing links it).
      - name: Install CUDA toolkit ${{ env.CUDA_VERSION }} (NVIDIA redist)
        run: |
          set -eux
          case "$CUDA_VERSION" in
            12.8.0) COMPONENTS="cuda_cudart:12.8.90 cuda_nvcc:12.8.93 cuda_nvrtc:12.8.93 libcublas:12.8.4.1 cuda_nvtx:12.8.90 cuda_profiler_api:12.8.90 cuda_cccl:12.8.90" ;;
            13.3)   COMPONENTS="cuda_crt:13.3.33 cuda_cudart:13.3.29 cuda_nvcc:13.3.33 cuda_nvrtc:13.3.33 libcublas:13.5.1.27 libnvvm:13.3.33 cuda_nvtx:13.3.29 cuda_profiler_api:13.3.27 cccl:13.3.3.3.1" ;;
            *) echo "no redist component table for CUDA $CUDA_VERSION" >&2; exit 1 ;;
          esac
          PREFIX="$HOME/cuda-$CUDA_VERSION"
          mkdir -p "$PREFIX"
          BASE="https://developer.download.nvidia.com/compute/cuda/redist"
          for cv in $COMPONENTS; do
            comp="${cv%:*}"; ver="${cv#*:}"
            name="${comp}-linux-x86_64-${ver}-archive"
            curl -fsSL --retry 3 -o comp.tar.xz "$BASE/${comp}/linux-x86_64/${name}.tar.xz"
            tar -xf comp.tar.xz
            cp -a "${name}/." "$PREFIX"/
            rm -rf comp.tar.xz "${name}"
          done
          ln -sfn lib "$PREFIX/lib64"
          {
            echo "CUDA_PATH=$PREFIX"
            echo "CUDA_HOME=$PREFIX"
            echo "LD_LIBRARY_PATH=$PREFIX/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/nvcc" --version

      # This leg rebuilt every object on every run: 3903 s of the 4121 s job on
      # 2026-08-09, and 4942 s on the run before it, with no speedup between the
      # two. The repo held no cache entry for it at all, only build.yml's ROCm
      # ones.
      #
      # The key carries the CUDA version and the architecture list because both
      # decide the objects. ccache hashes compiler identity into every entry, so
      # a cache written by another toolkit can never hit -- a version-less key
      # is what held the llama.cpp ROCm legs at a 0% hit rate and made them that
      # pipeline's critical path (llama.cpp#88). restore-keys lets a new tag
      # start from the previous generation instead of from nothing.
      - name: ccache key
        id: cckey
        run: echo "archs=$(echo "$CUDA_ARCHS" | tr ';' '-')" >> "$GITHUB_OUTPUT"

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: sd-cuda-${{ env.CUDA_VERSION }}-${{ steps.cckey.outputs.archs }}-${{ needs.resolve.outputs.tag }}
          restore-keys: |
            sd-cuda-${{ env.CUDA_VERSION }}-${{ steps.cckey.outputs.archs }}
          append-timestamp: false
          variant: ccache
          max-size: 2G
          # Saved by the explicit step below instead, so a failed build still
          # keeps what it compiled.
          save: false

      - name: cuDNN headers (build time only)
        run: |
          set -euo pipefail
          # ggml-cuda's cuDNN attention path (GGML_CUDA_CUDNN) compiles against cudnn.h, but the
          # library itself is opened with dlopen when the first attention op runs and is NOT
          # bundled: a host without a loadable libcudnn.so.9 keeps the ggml attention kernels.
          # Only the headers package is fetched (80 KB), pinned by version and checksum.
          deb=libcudnn9-headers-cuda-12_9.27.0.42-1_amd64.deb
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$deb" \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/$deb"
          echo "68243ab04422da565e0bafec00f64ac08cfd82d805c8015c0c503af7ab4dd1d6  $RUNNER_TEMP/$deb" | sha256sum -c -
          dpkg -x "$RUNNER_TEMP/$deb" "$RUNNER_TEMP/cudnn-deb"
          # The package ships cudnn*_v9.h; the unversioned names normally come from the -dev
          # package's alternatives, so link them here.
          inc="$RUNNER_TEMP/cudnn-include"
          mkdir -p "$inc"
          for f in "$RUNNER_TEMP"/cudnn-deb/usr/include/x86_64-linux-gnu/cudnn*_v9.h; do
            b="$(basename "$f")"
            ln -s "$f" "$inc/${b%_v9.h}.h"
          done
          test -e "$inc/cudnn.h"
          echo "CUDNN_INCLUDE_DIR=$inc" >> "$GITHUB_ENV"

      - name: Build sd-cli + sd-server (CUDA)
        working-directory: src
        run: |
          set -euo pipefail
          # cuda12 covers Volta through Blackwell. V100 can run H3 with quantized weights and CPU
          # offload, but a device probe succeeds even when the binary has no sm_70 kernels, so
          # sm_70 stays in the list.
          #
          # The CUDA launcher matters more than the other two here: nvcc lives outside the default
          # search, and nvcc is nearly the whole build, so caching only C/CXX would leave the
          # expensive half uncached.
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_BUILD_EXAMPLES=ON \
            -DSD_SERVER_BUILD_FRONTEND=OFF \
            -DSD_WEBP=OFF -DSD_WEBM=OFF \
            -DGGML_NATIVE=OFF \
            -DSD_CUDA=ON \
            -DSD_BUILD_SHARED_GGML_LIB=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_CUDA_COMPILER="$CUDA_PATH/bin/nvcc" \
            -DGGML_CUDA_CUDNN=ON \
            -DGGML_CUDA_CUDNN_INCLUDE_DIR="$CUDNN_INCLUDE_DIR" \
            -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCHS" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
          cmake --build build --config Release -j "$(nproc)" --target sd-cli sd-server
          # Diagnostic only, under set -e: never fail a good build over stats.
          ccache --show-stats || true

      - name: Pin the bundle's own ggml; leave the CUDA runtime to the host
        run: |
          set -euo pipefail
          BIN="${GITHUB_WORKSPACE}/src/build/bin"
          MAJOR="${CUDA_VERSION%%.*}"
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          # DT_RPATH, not RUNPATH: it is searched before LD_LIBRARY_PATH and covers the whole
          # dependency chain, so this bundle's libggml*.so win over llama.cpp's same-named ones
          # when Studio puts both directories on the loader path.
          for f in "$BIN"/sd-cli "$BIN"/sd-server "$BIN"/libggml*.so* "$BIN"/libstable-diffusion*.so*; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            patchelf --force-rpath --set-rpath '$ORIGIN' "$f"
          done
          ls -la "$BIN"
          if ls "$BIN" | grep -qE '^lib(cudart|cublas|cublasLt)\.so'; then
            echo "ERROR: a CUDA runtime library is in the bundle; the host provides it" >&2
            exit 1
          fi
          cuda_lib="$(ls "$BIN"/libggml-cuda.so* | head -1)"
          for so in "libcudart.so.${MAJOR}" "libcublas.so.${MAJOR}"; do
            readelf -d "$cuda_lib" | grep -qF "[${so}]" \
              || { echo "ERROR: $(basename "$cuda_lib") does not link ${so}" >&2; exit 1; }
          done
          # The host supplies exactly what llama.cpp's build of this major links. cuDNN and NVRTC are
          # run-time dlopens only; linking them would stop the binaries loading on hosts without them.
          allowed=" libcuda.so.1 libcudart.so.${MAJOR} libcublas.so.${MAJOR} libcublasLt.so.${MAJOR} "
          for f in "$BIN"/sd-cli "$BIN"/sd-server "$BIN"/libggml*.so* "$BIN"/libstable-diffusion*.so*; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            for so in $(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(lib\(cu\|nv\)[^]]*\)\].*/\1/p'); do
              case "$allowed" in
                *" $so "*) ;;
                *) echo "ERROR: $(basename "$f") links $so; only ${allowed} may come from the host" >&2; exit 1 ;;
              esac
            done
          done

      - name: Package bundle
        env:
          BIN_DIR: ${{ github.workspace }}/src/build/bin
          OUT_DIR: ${{ github.workspace }}/dist
          TAG: ${{ needs.resolve.outputs.tag }}
          LABEL: Linux-Ubuntu-22.04-x86_64-${{ matrix.line }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          SOURCE_REPO: ${{ github.repository }}
          LICENSE_FILE: ${{ runner.temp }}/LICENSE
        run: |
          set -euo pipefail
          # The binaries compile in cudnn-frontend's header-only templates, so its MIT notice ships too.
          {
            cat src/LICENSE
            printf '\n\n---- cudnn-frontend (https://github.com/NVIDIA/cudnn-frontend) ----\n\n'
            cat src/build/_deps/ggml_cudnn_frontend-src/LICENSE.txt
          } > "$LICENSE_FILE"
          python3 tooling/scripts/unsloth/package_bundle.py

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sd-${{ needs.resolve.outputs.tag }}-bin-Linux-Ubuntu-22.04-x86_64-${{ matrix.line }}
          path: dist/sd-${{ needs.resolve.outputs.tag }}-bin-Linux-Ubuntu-22.04-x86_64-${{ matrix.line }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Evict stale ccache files
        # !cancelled(), unlike the save below: a cancelled job gets one short
        # teardown window that is not replenished, and the save is what needs
        # it.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ccache --evict-older-than 14d

      - name: Save ccache
        # Save even when the build failed. The objects compiled before the
        # failure still count, and this leg is continue-on-error, so a failure
        # here is routine. always(), not !cancelled(): a job killed by the cap
        # takes the cancellation path, and that is the most expensive case to
        # lose (llama.cpp#81).
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          # Trailing dash keeps this distinct from the key the ccache action
          # restored from, so the save is never a no-op against itself.
          key: ccache-sd-cuda-${{ env.CUDA_VERSION }}-${{ steps.cckey.outputs.archs }}-${{ needs.resolve.outputs.tag }}-

  # Windows CUDA, same runtime policy as build-linux-cuda: the ggml*.dll ship beside the executables
  # (Windows searches the executable's own directory first, so llama.cpp's same-named DLLs elsewhere
  # on PATH never win), and cudart64 / cublas64 / cublasLt64 come from the host exactly as they do
  # for unslothai/llama.cpp's Windows CUDA build. No cuDNN attention path: the ggml kernels serve.
  build-windows-cuda:
    name: win-${{ matrix.line }}-x64
    needs: resolve
    continue-on-error: true
    if: ${{ needs.resolve.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2022
    timeout-minutes: 300
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: cuda12
            cuda: "12.8.0"
            archs: "70;75;80;86;89;90;100;120"
          - line: cuda13
            cuda: "13.3"
            archs: "75;80;86;89;90;100;120"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout mirror (tooling)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: tooling
          fetch-depth: 1

      - name: Download source @ ${{ needs.resolve.outputs.tag }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: ${{ needs.resolve.outputs.source_artifact }}
          path: srcpkg

      - name: Extract source
        shell: bash
        run: |
          set -eux
          mkdir -p src
          tar -xzf "srcpkg/sd-source-${{ needs.resolve.outputs.tag }}.tar.gz" -C src

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0

      # Component tables copied from unslothai/llama.cpp's unsloth-cuda-windows-setup.
      - name: Install CUDA toolkit ${{ matrix.cuda }} (NVIDIA redist)
        run: |
          $ErrorActionPreference = 'Stop'
          switch ("${{ matrix.cuda }}") {
            '12.8.0' { $components = @('cuda_cudart:12.8.57', 'cuda_nvcc:12.8.61', 'cuda_nvrtc:12.8.61', 'libcublas:12.8.3.14', 'cuda_nvtx:12.8.55', 'cuda_profiler_api:12.8.55', 'cuda_cccl:12.8.55', 'visual_studio_integration:12.8.55') }
            '13.3'   { $components = @('cuda_crt:13.3.33', 'cuda_cudart:13.3.29', 'cuda_nvcc:13.3.33', 'cuda_nvrtc:13.3.33', 'libcublas:13.5.1.27', 'libnvvm:13.3.33', 'cuda_nvtx:13.3.29', 'cuda_profiler_api:13.3.27', 'cccl:13.3.3.3.1', 'visual_studio_integration:13.3.27') }
            default  { throw "no redist component table for CUDA ${{ matrix.cuda }}" }
          }
          $line = "${{ matrix.cuda }}" -replace '^(\d+\.\d+).*$', '$1'
          $prefix = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$line"
          $stage = Join-Path $env:RUNNER_TEMP 'cuda-redist'
          New-Item -ItemType Directory -Force -Path $prefix, $stage | Out-Null
          foreach ($cv in $components) {
            $comp, $ver = $cv.Split(':')
            $name = "$comp-windows-x86_64-$ver-archive"
            $zip = Join-Path $stage "$name.zip"
            curl.exe -fsSL --retry 3 -o $zip "https://developer.download.nvidia.com/compute/cuda/redist/$comp/windows-x86_64/$name.zip"
            if ($LASTEXITCODE -ne 0) { throw "download failed: $name" }
            tar.exe -xf $zip -C $stage
            if ($LASTEXITCODE -ne 0) { throw "extract failed: $name" }
            robocopy (Join-Path $stage $name) $prefix /E /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "copy failed: $name ($LASTEXITCODE)" }
            Remove-Item -Recurse -Force $zip, (Join-Path $stage $name)
          }
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_HOME=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_PATH_V$($line.Replace('.', '_'))=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: ccache key
        id: cckey
        shell: bash
        run: echo "archs=$(echo '${{ matrix.archs }}' | tr ';' '-')" >> "$GITHUB_OUTPUT"

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: sd-cuda-${{ matrix.cuda }}-windows-${{ steps.cckey.outputs.archs }}-${{ needs.resolve.outputs.tag }}
          restore-keys: |
            sd-cuda-${{ matrix.cuda }}-windows-${{ steps.cckey.outputs.archs }}
          append-timestamp: false
          variant: ccache
          max-size: 3G
          save: false

      - name: Build sd-cli + sd-server (CUDA)
        working-directory: src
        run: |
          nvcc --version
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS='/bigobj' `
            -DSD_BUILD_EXAMPLES=ON `
            -DSD_SERVER_BUILD_FRONTEND=OFF `
            -DSD_WEBP=OFF -DSD_WEBM=OFF `
            -DGGML_NATIVE=OFF `
            -DSD_CUDA=ON `
            -DSD_BUILD_SHARED_GGML_LIB=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_CUDA_ARCHITECTURES='${{ matrix.archs }}' `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # -j 3: a multi-arch nvcc TU peaks near 3 GB RSS on the 16 GB hosted runner.
          cmake --build build --config Release -j 3 --target sd-cli sd-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ccache -s
          exit 0

      - name: Leave the CUDA runtime to the host
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'src/build/bin'
          $major = "${{ matrix.cuda }}".Split('.')[0]
          Get-ChildItem $bin | Format-Table Name, Length
          $bundled = @(Get-ChildItem $bin -Filter *.dll | Where-Object { $_.Name -match '^(cudart|cublas|cublasLt)64_' })
          if ($bundled.Count -gt 0) { throw "CUDA runtime DLLs in the bundle: $($bundled.Name -join ', ')" }
          $cuda = Join-Path $bin 'ggml-cuda.dll'
          if (-not (Test-Path $cuda)) { throw 'ggml-cuda.dll was not built' }
          $imports = (& dumpbin /dependents $cuda) -join "`n"
          $imports
          # cublas is always the host's. cudart is too on CUDA 12; CUDA 13 links it statically, as in
          # unslothai/llama.cpp's cuda13 build, which imports cublas64_13.dll alone.
          if ($imports -notmatch [regex]::Escape("cublas64_$major.dll")) { throw "ggml-cuda.dll does not import cublas64_$major.dll" }
          # Anything else CUDA-shaped (another major, nvrtc, cudnn) would not be on the host.
          $allowed = @('nvcuda.dll', "cudart64_$major.dll", "cublas64_$major.dll", "cublasLt64_$major.dll")
          foreach ($pe in Get-ChildItem $bin -Include *.dll, *.exe -Recurse) {
            $deps = [regex]::Matches(((& dumpbin /dependents $pe.FullName) -join "`n"), '(?im)^\s*((?:cu|nv)\S*\.dll)\s*$') | ForEach-Object { $_.Groups[1].Value }
            $extra = @($deps | Where-Object { $allowed -notcontains $_ })
            if ($extra.Count -gt 0) { throw "$($pe.Name) imports $($extra -join ', '); only $($allowed -join ', ') may come from the host" }
          }

      - name: Sign Windows binaries
        uses: ./tooling/.github/actions/sign-windows
        with:
          path: src/build/bin
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-account: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          azure-certificate-profile: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}

      - name: Package bundle
        env:
          BIN_DIR: ${{ github.workspace }}/src/build/bin
          OUT_DIR: ${{ github.workspace }}/dist
          TAG: ${{ needs.resolve.outputs.tag }}
          LABEL: win-${{ matrix.line }}-x64
          COMMIT: ${{ needs.resolve.outputs.commit }}
          SOURCE_REPO: ${{ github.repository }}
          LICENSE_FILE: ${{ github.workspace }}/src/LICENSE
        run: python tooling/scripts/unsloth/package_bundle.py

      - name: Verify every PE in the bundle is signed
        run: |
          $ErrorActionPreference = 'Continue'
          $zips = @(Get-ChildItem dist -Filter *.zip -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if ($zips.Count -eq 0) {
            Write-Host '::error::no bundle in dist/; packaging produced nothing to verify'
            exit 1
          }
          & tooling/.github/scripts/assert-windows-bundle-signed.ps1 -Path $zips
          exit $LASTEXITCODE

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sd-${{ needs.resolve.outputs.tag }}-bin-win-${{ matrix.line }}-x64
          path: dist/sd-${{ needs.resolve.outputs.tag }}-bin-win-${{ matrix.line }}-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Save ccache
        # always(): a job killed by the cap takes the cancellation path, the most expensive case to lose.
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-sd-cuda-${{ matrix.cuda }}-windows-${{ steps.cckey.outputs.archs }}-${{ needs.resolve.outputs.tag }}-

