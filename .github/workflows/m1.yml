name: m1-mac
on:
  push:
    branches: ['m1-*']
permissions:
  contents: read
env:
  STUDIO_SHA: 105013764b983f92558efe87c4d0fcf61f722f1c
  SDCPP_SHA: 6667be652926c21f2191ab4fa17506178e2108cc
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  PYTHONUNBUFFERED: "1"
jobs:
  mps_low_watermark:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {path: h}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Host + venv (torch pin = Studio Mac range)
        run: |
          set -eux
          mkdir -p results
          { sysctl hw.model hw.memsize hw.ncpu; sw_vers; } | tee results/host.txt
          python -m venv v && v/bin/pip install -q "torch>=2.13,<2.15.0" diffusers transformers accelerate psutil numpy pillow "huggingface_hub[cli]"
          v/bin/python -c "import torch,diffusers;print(torch.__version__,diffusers.__version__,torch.backends.mps.is_available())" | tee -a results/host.txt
          v/bin/hf download stabilityai/sd-turbo --include "*.json" "*.txt" "*fp16.safetensors" > /dev/null
      - name: Interleaved arms (unset / cap / 0.5), 3 rounds, 768 px 4 steps
        run: |
          set +e
          bash h/m1/mps_drive.sh v/bin/python h/m1/dd results/mps --size 768 --steps 4 --n 2 2>&1 | tee results/mps.log
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: res-mps, path: results/, retention-days: 7}
  zimage_route:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {path: h}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Studio venv (unsloth main, Studio's Mac requirement files)
        run: |
          set -eux
          mkdir -p results
          python -m pip install -q uv
          git init -q unsloth && git -C unsloth remote add origin https://github.com/unslothai/unsloth
          git -C unsloth fetch -q --depth 1 origin $STUDIO_SHA && git -C unsloth checkout -q FETCH_HEAD
          uv venv -q --python "$(which python)" venv_studio
          R=unsloth/studio/backend/requirements
          O="--override $R/single-env/overrides-darwin-arm64.txt"
          PY=venv_studio/bin/python
          uv pip install -q --python $PY "torch>=2.13,<2.15.0" "torchvision" "torchaudio"
          uv pip install -q --python $PY $O -r $R/no-torch-runtime.txt
          uv pip install -q --python $PY $O --no-deps -r $R/extras-no-deps.txt
          uv pip install -q --python $PY $O -r $R/studio.txt
          uv pip install -q --python $PY $O -r $R/diffusers-pin.txt
          grep -qv '^#' $R/diffusers-main.txt && uv pip install -q --python $PY $O -r $R/diffusers-main.txt || true
          uv pip install -q --python $PY psutil
      - name: Z-Image-Turbo through Studio's route on main
        run: |
          set +e
          export UNSLOTH_STUDIO_HOME=$RUNNER_TEMP/studio_home HF_HOME=$RUNNER_TEMP/hf
          export MACREAL_RELEASE_JSON=$PWD/h/m1/release.json
          perl -e 'alarm shift; exec @ARGV' 3000 venv_studio/bin/python -u h/m1/run_real.py --backend unsloth/studio/backend \
            --repo Tongyi-MAI/Z-Image-Turbo --steps 8 --guidance 0 --size 512 --out results/zimage.json > results/zimage.log 2>&1
          echo "exit $?" >> results/zimage.log
          grep -E "RESULT|^exit " results/zimage.log; tail -30 results/zimage.log; true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: res-zimage-route, path: results/, retention-days: 7}
  sdcpp_build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: leejet/stable-diffusion.cpp at #2403 merge (6667be65)
        run: |
          set -eux
          git init -q src && git -C src remote add origin https://github.com/leejet/stable-diffusion.cpp
          git -C src fetch -q --depth 1 origin $SDCPP_SHA && git -C src checkout -q FETCH_HEAD
          git -C src submodule update --init --depth 1 ggml || git -C src submodule update --init ggml
          git -C src log -1 --oneline; git -C src/ggml log -1 --oneline
      - name: Build (Darwin arm64 release flags)
        working-directory: src
        run: |
          set -euo pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON -DSD_SERVER_BUILD_FRONTEND=OFF -DSD_WEBP=OFF -DSD_WEBM=OFF \
            -DGGML_NATIVE=OFF -DSD_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=Apple -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 > cmake.log 2>&1 || { tail -60 cmake.log; exit 1; }
          cmake --build build --config Release -j "$(sysctl -n hw.logicalcpu)" --target sd-cli > build.log 2>&1 || { grep -E "error" build.log | head -40; tail -30 build.log; exit 1; }
          mkdir -p ../out && cp build/bin/sd-cli ../out/ && git rev-parse HEAD > ../out/sha.txt
      - uses: actions/upload-artifact@v4
        with: {name: bin-sdcpp, path: out/, retention-days: 5}
  sdcpp_render:
    needs: sdcpp_build
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {path: h}
      - uses: actions/download-artifact@v4
        with: {name: bin-sdcpp, path: bin}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Models (klein 4B INT8 ConvRot ComfyUI, Qwen3-4B Q3_K_M, flux2 VAE, r32 LoRA)
        run: |
          set -eux
          chmod +x bin/sd-cli; python -m pip install -q numpy pillow
          mkdir -p models loras results
          { sysctl hw.model hw.memsize hw.ncpu; sw_vers; cat bin/sha.txt; } | tee results/host.txt
          dl() { curl -fsSL --retry 5 --retry-all-errors -o "$1" "$2"; }
          dl models/klein4b_i8cr.safetensors https://huggingface.co/wraps/FLUX.2-klein-4B-INT8-ConvRot-ComfyUI/resolve/main/flux-2-klein-4b-int8-convrot.safetensors
          dl models/qwen3_4b_q3km.gguf https://huggingface.co/unsloth/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q3_K_M.gguf
          dl models/flux2_vae.safetensors https://huggingface.co/Comfy-Org/flux2-klein-4B/resolve/main/split_files/vae/flux2-vae.safetensors
          dl loras/r32.safetensors https://huggingface.co/thedeoxen/refcontrol-FLUX.2-klein-4B-reference-depth-lora/resolve/main/flux2_klein_4b_refcontrol_depth.safetensors
          shasum -a 256 models/* loras/* | tee results/models.sha256
      - name: A/B none / at_runtime / immediately, 3 rounds interleaved, 512 px 4 steps
        run: |
          set +e
          python -u h/m1/sdbench.py --bin bin/sd-cli --out results/klein \
            --model-args "--diffusion-model models/klein4b_i8cr.safetensors --vae models/flux2_vae.safetensors --llm models/qwen3_4b_q3km.gguf --mmap" \
            --lora-dir loras --lora r32 --size 512 --steps 4 --rounds 3 2>&1 | tee results/klein.log
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: res-sdcpp, path: results/, retention-days: 7}
