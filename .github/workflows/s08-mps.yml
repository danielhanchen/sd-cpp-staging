name: s08-mps
on:
  push:
    branches: ['s08-mps-*']
permissions:
  contents: read
env:
  # fail an allocation cleanly instead of swapping the 7.5 GB runner to death
  PYTORCH_MPS_HIGH_WATERMARK_RATIO: '0.8'
  RUN: python -u s08/s08_mps.py --device mps --cfg s08/vae_config.json --studio-dir s08/studio
jobs:
  mps:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          set -eux
          python -m pip install -q --upgrade pip
          python -m pip install -q torch==2.14.1 numpy  # 2.15 skips the runner's paravirtual GPU (no Metal 2.0)
          python -m pip install -q "diffusers==0.42.1" transformers accelerate
          mkdir -p res/vae
          { sysctl hw.model hw.memsize hw.ncpu machdep.cpu.brand_string; sw_vers; python -c "import torch,diffusers;print(torch.__version__, diffusers.__version__, torch.backends.mps.is_available())"; } > res/host.txt 2>&1; cat res/host.txt
      - name: Step 1 tile ops (MPS)
        run: |
          set -o pipefail
          $RUN --out res/tile --tile 256 --iters 20 --skip-full --skip-vae 2>&1 | tee res/tile.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: {name: s08-tile, path: res/, retention-days: 7}
      - name: Step 2 VAE encode 1024 reference, one arm per process
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          $RUN --out res/vae --res 1024 --vae-arm cpuref 2>&1 | tee -a res/vae.log
          for dt in fp32 bf16; do
            for arm in lowered stock; do
              $RUN --out res/vae --res 1024 --vae-iters 3 --vae-arm $arm --vae-dtype $dt 2>&1 | tee -a res/vae.log || echo "arm $arm $dt rc=$?" | tee -a res/vae.log
            done
          done
          $RUN --out res/vae --vae-arm compare 2>&1 | tee -a res/vae.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: {name: s08-vae, path: res/vae*, retention-days: 7}
