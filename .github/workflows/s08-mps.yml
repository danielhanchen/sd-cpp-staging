name: s08-mps
on:
  push:
    branches: ['s08-mps-*']
permissions:
  contents: read
env:
  # fail an allocation cleanly instead of swapping the 7.5 GB runner to death
  PYTORCH_MPS_HIGH_WATERMARK_RATIO: '0.8'
  PYTORCH_MPS_LOW_WATERMARK_RATIO: '0.6'
  RUN: python -u s08/s08_mps.py --device mps --cfg s08/vae_config.json --studio-dir s08/studio
jobs:
  mps:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          set -eux
          python -m pip install -q --upgrade pip
          python -m pip install -q torch==2.14.1 numpy  # 2.15 skips the runner's paravirtual GPU (no Metal 2.0)
          python -m pip install -q "diffusers==0.42.1" transformers accelerate
          mkdir -p res/vae256
          { sysctl hw.model hw.memsize hw.ncpu machdep.cpu.brand_string; sw_vers; python -c "import torch,diffusers;print(torch.__version__, diffusers.__version__, torch.backends.mps.is_available())"; } > res/host.txt 2>&1; cat res/host.txt
      - name: Step 2b one 256 tile encode, stock first (default watermark)
        timeout-minutes: 30
        env: {PYTORCH_MPS_HIGH_WATERMARK_RATIO: '', PYTORCH_MPS_LOW_WATERMARK_RATIO: ''}
        run: |
          unset PYTORCH_MPS_HIGH_WATERMARK_RATIO PYTORCH_MPS_LOW_WATERMARK_RATIO
          $RUN --out res/vae256 --res 256 --vae-arm cpuref 2>&1 | tee -a res/vae256.log
          for arm in stock lowered; do
            $RUN --out res/vae256 --res 256 --vae-iters 3 --vae-arm $arm --vae-dtype fp32 2>&1 | tee -a res/vae256.log || echo "arm $arm rc=$?" | tee -a res/vae256.log
          done
          $RUN --out res/vae256 --vae-arm compare 2>&1 | tee -a res/vae256.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: {name: s08-vae256, path: res/vae256*, retention-days: 7}
