name: s08-mps
on:
  push:
    branches: ['s08-mps-*']
permissions:
  contents: read
jobs:
  mps:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          set -eux
          python -m pip install -q --upgrade pip
          python -m pip install -q torch==2.14.1 numpy  # 2.15 skips the runner's paravirtual GPU (no Metal 2.0)
          python -m pip install -q "diffusers==0.42.1" transformers accelerate || python -m pip install -q "diffusers==0.43.0" transformers accelerate
          mkdir -p res
          { sysctl hw.model hw.memsize hw.ncpu machdep.cpu.brand_string; sw_vers; python -c "import torch,diffusers;print(torch.__version__, diffusers.__version__, torch.backends.mps.is_available())"; } > res/host.txt 2>&1; cat res/host.txt
      - name: Step 1 tile ops + Step 2 VAE encode (MPS)
        run: |
          set -o pipefail
          python -u s08/s08_mps.py --device mps --cfg s08/vae_config.json --studio-dir s08/studio --out res/tile --res 1024 --tile 256 --iters 20 --vae-iters 3 --skip-full 2>&1 | tee res/tile.log
      - name: Step 1 untiled 1024 ops (MPS)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          python -u s08/s08_mps.py --device mps --cfg s08/vae_config.json --studio-dir s08/studio --out res/full --res 1024 --tile 1024 --iters 20 --skip-full --skip-vae 2>&1 | tee res/full.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: {name: s08-res, path: res/, retention-days: 7}
