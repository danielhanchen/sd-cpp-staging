name: armws
on:
  push:
    branches: ['sdrc-armws-*']
permissions:
  contents: read
jobs:
  leg:
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux_arm64
            runner: ubuntu-24.04-arm
            args: >-
              --arms m82=armws-master:arm82,m86=armws-master:arm86,b86=armws-b:arm86
              --runs m82=m82,m86=m86,b86=b86,m86_hog=m86+hog,b86_hog=b86+hog --ref m86
              --types q8_0,q4_0,q5_0,q4_K,q5_K,q6_K,q3_K,iq4_xs
          - leg: linux_x64
            runner: ubuntu-latest
            args: >-
              --arms m=armws-master:x64native,b=armws-b:x64native
              --runs m=m,b=b,m_hog=m+hog,b_hog=b+hog --ref m
              --types q8_0,q4_0,q5_0,q4_1,iq4_nl,q4_K,q6_K,q3_K --shapes 3072,3072,1024/3072,12288,1024/3072,3072,8
          - leg: windows_arm64
            runner: windows-11-arm
            args: >-
              --arms pin=armws-master:win_static,head=armws-a:win_dl
              --runs pin=pin,head=head,head_noi8mm=head+noi8mm --ref pin
              --types q8_0,q4_0,q5_0,q4_K,q5_K,q6_K,q3_K,iq4_xs
    steps:
      - uses: actions/checkout@v4
        with: {path: h}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ runner.os == 'Windows' && '3.11' || '3.12' }}"}
      - name: tools (unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          python -m pip install -q ninja numpy pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-14 g++-14
          lscpu | head -20
      - name: tools (windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          python --version
          python -m pip install -q ninja
          python -m pip install -q numpy pillow; if ($LASTEXITCODE -ne 0) { Write-Host "numpy / pillow unavailable: byte compare only" }
          $global:LASTEXITCODE = 0
          (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
      - name: MSVC env (windows arm64)
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: arm64
      - name: run
        shell: bash
        run: |
          set -o pipefail
          python -u h/armws/armws_remote.py ${{ matrix.args }} 2>&1 | tee run.log
      - name: head workflow's variant gate on the head build (windows)
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          python h/armws/extract_gate.py w/src_head/.github/workflows/unsloth-sd-prebuilt.yml | Out-File -Encoding utf8 gate.ps1
          Get-Content gate.ps1
          $cli = Get-Item w/bin_head/sd-cli.exe
          . ./gate.ps1 2>&1 | Tee-Object -FilePath art/variant_gate.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armws-${{ matrix.leg }}
          path: |
            art
            run.log
          retention-days: 7
