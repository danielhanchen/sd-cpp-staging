name: c17
on:
  push:
    branches: ['r8c1734-*']
permissions:
  contents: read
jobs:
  leg:
    name: ${{ matrix.model }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include: [{"model": "zimage", "args": "--model zimage --steps 8 --freq 19 --no-ab --wrap"}]
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@v4
        with: {path: h}
      - name: deps
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache ninja-build gcc-14 g++-14
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-generic || true
          ls /usr/lib/linux-tools/*/ || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          free -g; nproc; uname -a
      - name: run
        run: python3 -u h/c17/run.py ${{ matrix.args }} 2>&1 | tee run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res-${{ matrix.model }}
          path: |
            art
            run.log
          retention-days: 7
